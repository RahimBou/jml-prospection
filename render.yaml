services:
  # Frontend statique public. Les appels /api/* sont proxifiés vers le serveur Node.
  - type: web
    name: jml-prospection
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://jml-prospection-api.onrender.com/api/*
  
  # API Node réelle : DVF / DPE / Radar / Annonces.
  - type: web
    name: jml-prospection-api
    runtime: node
    buildCommand: ""
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /api/health

  # Nouvelle V2 propre, totalement séparée de la V1.
  - type: web
    name: jml-prospection-v2
    runtime: node
    rootDir: jml-prospection-v2
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
