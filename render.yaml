services:
  # Frontend statique historique conservé dans Render.
  - type: web
    name: jml-prospection
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true

  # Service Node actuellement utilisé : frontend + API DVF/DPE/Radar/Annonces.
  - type: web
    name: jml-prospection-web
    runtime: node
    buildCommand: ""
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /api/health

  # V2 séparée de la V1.
  - type: web
    name: jml-prospection-v2
    runtime: node
    rootDir: jml-prospection-v2
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
