services:
  # API Node réelle : DVF / DPE / Radar / Annonces.
  # Ce service existe déjà dans Render sous ce nom et est de type Node.
  - type: web
    name: jml-prospection
    runtime: node
    buildCommand: ""
    startCommand: node server.js
    autoDeploy: true
    healthCheckPath: /api/health

  # Frontend statique public.
  # Les appels /api/* sont proxifiés vers l'API Node existante.
  - type: web
    name: jml-prospection-web
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    autoDeploy: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://jml-prospection.onrender.com/api/*

  # V2 séparée de la V1.
  - type: web
    name: jml-prospection-v2
    runtime: node
    rootDir: jml-prospection-v2
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
