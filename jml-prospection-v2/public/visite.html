<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JML Visite + Dossier vendeur</title>
<style>
:root{--green:#18352c;--gold:#b78b4a;--cream:#f4f1eb;--line:#ddd5c8;--ink:#20251f;--muted:#6b6b66}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{background:var(--green);color:#fff;padding:16px 5%;display:flex;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:10}
main{max-width:1180px;margin:22px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #00000012}.hero{border-top:5px solid var(--gold)}
.eyebrow{font-size:.8rem;color:var(--muted);font-weight:800;letter-spacing:.06em}h1{margin:6px 0;font-size:1.55rem}.address{font-size:1.15rem;font-weight:800}.small{font-size:.86rem;color:var(--muted)}
.top-actions,.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}button,a.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green);color:#fff;text-decoration:none;cursor:pointer;font-weight:800}button.alt,a.alt{background:var(--gold)}button.light{background:#eee9df;color:#222}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{margin-bottom:12px}.field label{display:block;font-weight:800;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:#fff}textarea{min-height:105px;resize:vertical}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tag{background:#eee9df;padding:7px 10px;border-radius:999px;font-size:.86rem}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.section-title h2{margin:0;font-size:1.15rem}
.check{display:flex;gap:9px;align-items:flex-start;padding:8px 0}.check input{width:auto;margin-top:3px;transform:scale(1.15)}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.status-btn{background:#f3f1ed!important;color:#222!important;border:2px solid transparent!important}.status-btn.active{border-color:var(--gold)!important;background:#ead8b9!important}
.notice{padding:11px 13px;background:#f7f3ea;border-left:4px solid var(--gold);border-radius:8px;margin:10px 0}.private{background:#f1f1ee;border:1px dashed #aaa}.private strong{color:#6c4a1f}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.photo{position:relative;border-radius:10px;overflow:hidden;background:#eee;min-height:130px}.photo img{width:100%;height:170px;object-fit:cover;display:block}.photo button{position:absolute;right:6px;top:6px;padding:5px 8px;background:#000c}
.documents{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.documents label{padding:9px;background:#f6f4ef;border-radius:9px}.saved{min-height:20px;color:#176b45;font-weight:800}.dossier-cover{display:none}.footer{color:var(--muted);font-size:.8rem;text-align:center;padding:20px}
@media(max-width:760px){.grid,.grid3,.documents{grid-template-columns:1fr}.status-grid{grid-template-columns:1fr 1fr}.photo-grid{grid-template-columns:1fr 1fr}header{position:static}}
@media print{body{background:#fff;font-size:11pt}header,.no-print,.top-actions,.actions,.private{display:none!important}main{max-width:none;margin:0;padding:0}.card{box-shadow:none;border:1px solid #ddd;border-radius:0;margin:0 0 12px;padding:15px;break-inside:avoid}.dossier-cover{display:block;min-height:235px;padding:28px;border:0;background:#fff;break-after:page}.dossier-cover .brand{font-size:18pt;font-weight:900;color:var(--green);margin-bottom:45px}.dossier-cover h1{font-size:25pt;color:var(--green)}.dossier-cover .goldline{height:4px;background:var(--gold);width:90px;margin:18px 0}.photo-grid{grid-template-columns:repeat(2,1fr)}.photo img{height:190px}a{color:#111;text-decoration:none}}
</style>
</head>
<body>
<header class="no-print"><strong>JML Immobilier · Visite + Dossier vendeur</strong><small>V1.0</small></header>
<main><div id="app"></div></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let data=null;
try{data=JSON.parse(localStorage.getItem("jml_visit")||"null")}catch(e){console.warn("jml_visit invalide, réinitialisation",e);try{localStorage.removeItem("jml_visit")}catch(_){}}
const app=document.getElementById("app");
if(!data){app.innerHTML='<div class="card"><h2>Prospect introuvable</h2><p>Retourne au Radar et utilise « Préparer la visite ».</p><a class="btn" href="/">← Retour au Radar</a></div>'}
else{
 const address=data.address||"Adresse non précisée",city=data.city||"",key="jml_prospect_"+address,old=JSON.parse(localStorage.getItem(key)||"null")||{},bd=data.score_breakdown||{};
 const level=(data.terrain_ready&&Number(data.score||0)>=70)?"A":(data.terrain_ready&&Number(data.score||0)>=58)?"B":(data.seller_signal==="fort"&&data.terrain_ready)?"A":(data.seller_signal==="probable"&&data.terrain_ready)?"B":"C";
 const reason=(data.reason||[]).map(x=>'<span class="tag">'+esc(x)+'</span>').join("");
 const initial={status:old.status||"À qualifier",owner:old.owner||"",phone:old.phone||"",email:old.email||"",next:old.next||"",nextDate:old.nextDate||"",notes:old.notes||"",objections:old.objections||"",price:old.price||"",estimateLow:old.estimateLow||"",estimateTarget:old.estimateTarget||"",estimateHigh:old.estimateHigh||"",sellerProject:old.sellerProject||"",sellerDelay:old.sellerDelay||"",sellerReason:old.sellerReason||"",checks:old.checks||[],docs:old.docs||[],photos:old.photos||[]};
 app.innerHTML=
 '<section class="dossier-cover"><div class="brand">JML IMMOBILIER</div><div class="goldline"></div><h1>Dossier vendeur</h1><p class="address">'+esc(address)+'</p><p>'+esc(city)+'</p><p style="margin-top:45px">Préparé par <strong>Abderrahim Boujnikh</strong><br>Agent commercial indépendant · Réseau JML Immobilier</p><p class="small">Document généré à partir de la fiche de visite JML.</p></section>'+
 '<section class="card hero"><div class="eyebrow">🎯 PROSPECT · PRIORITÉ '+level+'</div><h1>'+esc(address)+'</h1><div>'+esc(city)+'</div><div class="tags">'+(data.dpe?'<span class="tag">DPE '+esc(data.dpe)+'</span>':'')+(data.ges?'<span class="tag">GES '+esc(data.ges)+'</span>':'')+(data.surface?'<span class="tag">'+esc(data.surface)+' m²</span>':'')+(data.construction_year?'<span class="tag">Construction '+esc(data.construction_year)+'</span>':'')+(data.last_dvf_price?'<span class="tag">Dernier DVF ≈ '+esc(data.last_dvf_price)+' €/m²</span>':'')+'</div><div class="top-actions no-print"><a class="btn" href="/">← Retour au Radar</a><button class="alt" id="saveTop">💾 Enregistrer</button><button id="print">📄 Générer / imprimer le dossier</button><a class="btn light" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(address+" "+city)+'">🚗 Itinéraire</a></div></section>'+
 '<section class="card"><div class="section-title"><h2>📊 Analyse issue du Radar</h2><span class="small">Contexte de prospection</span></div><div class="tags">'+(bd.dpe!=null?'<span class="tag">DPE +'+bd.dpe+'</span>':'')+(bd.ges!=null?'<span class="tag">GES +'+bd.ges+'</span>':'')+(bd.surface!=null?'<span class="tag">Surface +'+bd.surface+'</span>':'')+(bd.age!=null?'<span class="tag">Âge +'+bd.age+'</span>':'')+(bd.market_absence!=null?'<span class="tag">Absence annonce +'+bd.market_absence+'</span>':'')+(bd.dvf_history!=null?'<span class="tag">Historique DVF +'+bd.dvf_history+'</span>':'')+(bd.data_quality!=null?'<span class="tag">Qualité données +'+bd.data_quality+'</span>':'')+'</div><div class="tags">'+reason+'</div><p class="small">Score Radar : <strong>'+esc(data.score??"—")+'/100</strong>. Les signaux du Radar décrivent un potentiel de prospection ; ils ne constituent pas une conclusion sur l'intention du propriétaire.</p></section>'+
 '<section class="card"><div class="section-title"><h2>👤 Vendeur / contact</h2></div><div class="grid"><div class="field"><label>Nom / prénom</label><input id="owner"></div><div class="field"><label>Téléphone</label><input id="phone" type="tel"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Projet / situation</label><select id="sellerProject"><option value="">À qualifier…</option><option>Pas de projet identifié</option><option>Projet à moyen terme</option><option>Projet à court terme</option><option>Bien déjà en vente</option><option>Mandat obtenu</option></select></div><div class="field"><label>Délai envisagé</label><input id="sellerDelay" placeholder="Ex. 3 à 6 mois"></div><div class="field"><label>Motif / besoin exprimé</label><input id="sellerReason" placeholder="À renseigner si le vendeur l'exprime"></div></div></section>'+
 '<section class="card"><div class="section-title"><h2>🚦 Résultat de la prospection</h2><span id="currentStatus" class="tag">'+esc(initial.status)+'</span></div><div class="status-grid">'+["Propriétaire rencontré","Absent","À rappeler","Pas vendeur","Projet de vente identifié","Mandat obtenu"].map(s=>'<button class="status-btn" data-status="'+esc(s)+'">'+esc(s)+'</button>').join("")+'</div></section>'+
 '<section class="card"><div class="section-title"><h2>📋 Checklist de visite</h2><span class="small">À compléter sur place</span></div>'+["Adresse vérifiée sur place","Type de bien confirmé","Surface habitable confirmée","Terrain / dépendances vérifiés","DPE / GES vérifiés","Occupation / vacance vérifiée","État général relevé","Travaux à prévoir identifiés","Points forts commerciaux identifiés","Projet de vente clarifié"].map((s,i)=>'<label class="check"><input type="checkbox" data-check="'+i+'"> '+s+'</label>').join("")+'</section>'+
 '<section class="card"><div class="section-title"><h2>📝 Compte-rendu de visite</h2></div><div class="field"><label>Observations terrain</label><textarea id="notes" placeholder="État du bien, travaux, environnement, projet…"></textarea></div><div class="field"><label>Objections / besoins</label><textarea id="objections" placeholder="Prix, délai, concurrence, hésitations…"></textarea></div></section>'+
 '<section class="card private"><div class="section-title"><h2>🔒 Zone interne · estimation</h2><span class="small">Non imprimée dans le dossier vendeur</span></div><div class="notice"><strong>Important :</strong> le prix envisagé par le propriétaire reste séparé de l'analyse de valeur.</div><div class="grid3"><div class="field"><label>Prix annoncé / envisagé par le propriétaire</label><input id="price" type="number" min="0" placeholder="€"></div><div class="field"><label>Estimation basse</label><input id="estimateLow" type="number" min="0" placeholder="€"></div><div class="field"><label>Estimation centrale</label><input id="estimateTarget" type="number" min="0" placeholder="€"></div></div><div class="field"><label>Estimation haute</label><input id="estimateHigh" type="number" min="0" placeholder="€"></div></section>'+
 '<section class="card"><div class="section-title"><h2>📎 Documents à récupérer</h2></div><div class="documents">'+["DPE / diagnostics","Taxe foncière","Titre de propriété","Plans / surfaces","Factures travaux","Assurance / sinistre","Charges / copropriété","Règlement de copropriété","Assainissement","Autres documents"].map((s,i)=>'<label><input type="checkbox" data-doc="'+i+'"> '+s+'</label>').join("")+'</div></section>'+
 '<section class="card"><div class="section-title"><h2>📸 Photos du bien</h2><span class="small">6 photos maximum · optimisées pour le dossier</span></div><input class="no-print" id="photos" type="file" accept="image/*" multiple><div id="photoGrid" class="photo-grid"></div></section>'+
 '<section class="card"><div class="section-title"><h2>📅 Prochaine étape</h2></div><div class="grid"><div class="field"><label>Action</label><select id="next"><option value="">Choisir…</option><option>Rappeler</option><option>Repasser</option><option>Envoyer une estimation</option><option>Envoyer le dossier vendeur</option><option>Suivre le projet</option><option>Aucune</option></select></div><div class="field"><label>Date</label><input id="nextDate" type="date"></div></div><div class="actions no-print"><button id="save">💾 Enregistrer la fiche</button><button class="alt" id="print2">📄 Générer le dossier vendeur</button><a class="btn light" href="/">Retour au Radar</a></div><p id="saved" class="saved"></p></section>'+
 '<div class="footer">JML Immobilier · Abderrahim Boujnikh · Agent commercial indépendant · Réseau JML Immobilier</div>';

 const set=(id,v)=>{const e=document.getElementById(id);if(e&&v!==undefined)e.value=v};
 ["owner","phone","email","sellerProject","sellerDelay","sellerReason","next","nextDate","notes","objections","price","estimateLow","estimateTarget","estimateHigh"].forEach(id=>set(id,initial[id]));
 document.querySelectorAll("[data-check]").forEach((e,i)=>e.checked=!!initial.checks[i]);document.querySelectorAll("[data-doc]").forEach((e,i)=>e.checked=!!initial.docs[i]);
 let status=initial.status;
 function collect(){return {...old,status,owner:document.getElementById("owner").value,phone:document.getElementById("phone").value,email:document.getElementById("email").value,sellerProject:document.getElementById("sellerProject").value,sellerDelay:document.getElementById("sellerDelay").value,sellerReason:document.getElementById("sellerReason").value,next:document.getElementById("next").value,nextDate:document.getElementById("nextDate").value,notes:document.getElementById("notes").value,objections:document.getElementById("objections").value,price:document.getElementById("price").value,estimateLow:document.getElementById("estimateLow").value,estimateTarget:document.getElementById("estimateTarget").value,estimateHigh:document.getElementById("estimateHigh").value,checks:[...document.querySelectorAll("[data-check]")].map(x=>x.checked),docs:[...document.querySelectorAll("[data-doc]")].map(x=>x.checked),photos,updatedAt:new Date().toISOString()}}
 function save(show=true){localStorage.setItem(key,JSON.stringify(collect()));if(show)document.getElementById("saved").textContent="✓ Fiche enregistrée sur cet appareil."}
 document.querySelectorAll("[data-status]").forEach(b=>{b.classList.toggle("active",b.dataset.status===status);b.onclick=()=>{status=b.dataset.status;document.getElementById("currentStatus").textContent=status;document.querySelectorAll("[data-status]").forEach(x=>x.classList.toggle("active",x===b));save(false)}});
 let photos=Array.isArray(initial.photos)?initial.photos:[];
 function renderPhotos(){document.getElementById("photoGrid").innerHTML=photos.map((src,i)=>'<div class="photo"><img src="'+src+'"><button class="no-print" data-remove-photo="'+i+'">✕</button></div>').join("")||'<div class="small">Aucune photo ajoutée.</div>';document.querySelectorAll("[data-remove-photo]").forEach(b=>b.onclick=()=>{photos.splice(Number(b.dataset.removePhoto),1);renderPhotos();save(false)})}
 async function resize(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.75))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
 document.getElementById("photos").onchange=async e=>{for(const f of [...e.target.files].slice(0,6-photos.length)){try{photos.push(await resize(f))}catch{}}e.target.value="";renderPhotos();save(false)};
 document.getElementById("save").onclick=()=>save(true);document.getElementById("saveTop").onclick=()=>save(true);document.getElementById("print").onclick=()=>{save(false);window.print()};document.getElementById("print2").onclick=()=>{save(false);window.print()};renderPhotos();
}
</script>
</body>
</html>
