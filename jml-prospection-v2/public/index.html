<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JML Prospection V2</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top"><div><span class="eyebrow">JML IMMOBILIER</span><h1>Prospection V2</h1><p>Radar terrain · annonces · DVF · DPE · mémoire du marché</p></div><span id="status" class="pill">Initialisation…</span></header>
<main>
<section class="panel">
<h2>📡 Veille marché</h2>
<div class="grid">
<label>Département<input id="dept" value="08"></label>
<label>Commune<input id="city" value="Charleville-Mézières"></label>
<label>Rayon (km)<input id="radius" type="number" value="10" min="1" max="50"></label>
<label>Sources web<input id="sources" type="number" value="9" min="3" max="9"></label>
</div>
<div class="actions"><button id="search">🔎 Rechercher</button><button id="market">🎯 Radar complet</button><button id="health">🩺 Sources</button></div>
<div id="message" class="message"></div>
</section>
<section class="stats" id="stats"></section>
    <section class="panel"><h2>🎯 Top 10 terrain</h2>
<div class="tour-toolbar">
  <div><b>Préparer une tournée</b><span id="selectionCount">0/10 sélectionné(s)</span></div>
  <div class="tour-actions">
    <button id="selectPriority">⚡ Sélectionner les priorités</button>
    <button id="clearSelection" class="secondary">✕ Effacer</button>
    <button id="prepareTour">🗺️ Préparer ma tournée</button>
  </div>
</div>
<div class="tour-start">
  <label>📍 Départ
    <select id="tourStart">
      <option value="current">Ma position actuelle</option>
      <option value="first">Premier prospect</option>
      <option value="address">Adresse personnalisée</option>
    </select>
  </label>
  <input id="tourStartAddress" type="text" placeholder="Adresse de départ…" style="display:none">
</div>
<div id="tourMessage" class="message"></div>
<div id="top10" class="results"><div class="empty">Lance une analyse pour calculer les opportunités.</div></div></section>
<section class="panel">
<div class="tabs">
<button class="tab active" data-tab="current">🔴 À vendre</button>
<button class="tab" data-tab="hidden">🟠 À vérifier terrain</button>
<button class="tab" data-tab="disappeared">🟡 Disparues</button>
<button class="tab" data-tab="price">🔵 Prix modifiés</button>
</div>
<div class="section-head"><h2 id="sectionTitle">🎯 Annonces en ligne</h2><span id="count"></span></div>
<div id="results" class="results"><div class="empty">Lance le Radar complet.</div></div>
</section>
</main>
<script src="/app.js"></script>
</body></html>
