<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JML Prospection V2</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div>
      <span class="eyebrow">JML IMMOBILIER</span>
      <h1>Prospection V2</h1>
      <p>Un nouveau moteur, séparé de l'ancienne version.</p>
    </div>
    <span id="status" class="pill">Initialisation…</span>
  </header>

  <main>
    <section class="panel">
      <h2>📡 Veille marché</h2>
      <div class="grid">
        <label>Département<input id="dept" value="08"></label>
        <label>Commune<input id="city" value="Charleville-Mézières"></label>
        <label>Rayon<input id="radius" type="number" value="10" min="1" max="50"></label>
        <label>Sources web<input id="sources" type="number" value="9" min="3" max="9"></label>
      </div>
      <div class="actions">
        <button id="search">🔎 Rechercher</button>
        <button id="market">📊 Analyser le marché</button>
        <button id="health">🩺 Vérifier les sources</button>
      </div>
    </section>

    <section class="stats" id="stats"></section>
    <section class="panel">
      <div class="section-head">
        <h2>🎯 Résultats</h2>
        <span id="count"></span>
      </div>
      <div id="results" class="results">
        <div class="empty">Lance une recherche pour commencer.</div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
